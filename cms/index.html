<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fiori Oscuri Admin</title>
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <img src="../branding/Use For Website/logo ufficiale bianco.svg" alt="Fiori Oscuri"
                    class="sidebar-logo">
                <span class="sidebar-title">Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="index.html" class="sidebar-link">
                    <span class="sidebar-link-icon">◈</span>
                    <span>Dashboard</span>
                </a>
                <a href="users.html" class="sidebar-link">
                    <span class="sidebar-link-icon">☾</span>
                    <span>Utenti</span>
                </a>
                <a href="events.html" class="sidebar-link">
                    <span class="sidebar-link-icon">✦</span>
                    <span>Eventi</span>
                </a>
                <a href="flowers.html" class="sidebar-link">
                    <span class="sidebar-link-icon">❀</span>
                    <span>Fiori</span>
                </a>

            </nav>
            <div class="sidebar-footer">
                <a href="../index.html">← Torna al sito</a>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div>
                    <h1 class="page-title">Dashboard</h1>
                    <p class="page-subtitle">Panoramica del sistema</p>
                </div>
            </header>

            <!-- Stats -->
            <div class="stats-grid" id="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="stat-users">—</div>
                    <div class="stat-label">Utenti Totali</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-active">—</div>
                    <div class="stat-label">Utenti Attivi</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-events">—</div>
                    <div class="stat-label">Eventi</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="stat-flowers">—</div>
                    <div class="stat-label">Fiori in Circolo</div>
                </div>
            </div>

            <!-- Recent Users -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Ultimi Iscritti</h2>
                    <a href="users.html" class="btn btn-sm">Vedi tutti</a>
                </div>
                <div class="card-body">
                    <table>
                        <thead>
                            <tr>
                                <th>Utente</th>
                                <th>Fiori</th>
                                <th>Stato</th>
                                <th>Iscritto</th>
                            </tr>
                        </thead>
                        <tbody id="recent-users">
                            <tr>
                                <td colspan="4" class="loading">Caricamento...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Upcoming Events -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Prossimi Eventi</h2>
                    <a href="events.html" class="btn btn-sm">Gestisci</a>
                </div>
                <div class="card-body">
                    <table>
                        <thead>
                            <tr>
                                <th>Evento</th>
                                <th>Data</th>
                                <th>Location</th>
                            </tr>
                        </thead>
                        <tbody id="upcoming-events">
                            <tr>
                                <td colspan="3" class="loading">Caricamento...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/admin.js"></script>
    <script>
        async function init() {
            try {
                // Load stats
                const stats = await admin.loadDashboardStats();
                document.getElementById('stat-users').textContent = stats.totalUsers;
                document.getElementById('stat-active').textContent = stats.activeUsers;
                document.getElementById('stat-events').textContent = stats.totalEvents;
                document.getElementById('stat-flowers').textContent = stats.totalFlowers;

                // Load recent users
                const users = await admin.loadUsers();
                const recentUsers = users.slice(0, 5);
                document.getElementById('recent-users').innerHTML = recentUsers.map(u => `
                    <tr class="clickable" onclick="admin.navigate('user-detail.html', {id: '${u.id}'})">
                        <td>
                            <div class="user-info">
                                <span class="user-name">${u.display_name || 'Anonimo'}</span>
                                <span class="user-email">${u.email}</span>
                            </div>
                        </td>
                        <td>${u.flower_count || 0}</td>
                        <td>
                            <span class="badge ${u.is_frozen ? 'badge-danger' : 'badge-success'}">
                                ${u.is_frozen ? 'Frozen' : 'Attivo'}
                            </span>
                        </td>
                        <td>${admin.formatShortDate(u.created_at)}</td>
                    </tr>
                `).join('') || '<tr><td colspan="4" class="empty-state">Nessun utente</td></tr>';

                // Load upcoming events
                const events = await admin.loadEvents();
                const upcomingEvents = events
                    .filter(e => new Date(e.event_date) > new Date())
                    .slice(0, 5);

                document.getElementById('upcoming-events').innerHTML = upcomingEvents.map(e => `
                    <tr class="clickable" onclick="admin.navigate('event-detail.html', {id: '${e.id}'})">
                        <td><strong>${e.title}</strong></td>
                        <td>${admin.formatDate(e.event_date)}</td>
                        <td>${e.location}</td>
                    </tr>
                `).join('') || '<tr><td colspan="3" class="empty-state">Nessun evento in programma</td></tr>';

            } catch (err) {
                console.error(err);
                admin.showToast('Errore di connessione', 'error');
            }
        }

        init();
    </script>
</body>

</html>
