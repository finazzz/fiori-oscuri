<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifesto - Fiori Oscuri</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="is-preload">
    <div id="bg"></div>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="navbar-inner">
            <a href="manifesto.html" class="navbar-logo">
                <img src="branding/Use For Website/logo ufficiale bianco.svg" alt="Fiori Oscuri">
                <span>Fiori Oscuri</span>
            </a>

            <ul class="navbar-links">
                <li><a href="manifesto.html" class="active">Manifesto</a></li>
                <li><a href="events.html">Next Event</a></li>
                <li><a href="account.html">Account</a></li>
            </ul>

            <div class="burger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Mobile Menu -->
    <div class="mobile-menu">
        <a href="manifesto.html">Manifesto</a>
        <a href="events.html">Next Event</a>
        <a href="account.html">Account</a>
    </div>

    <main class="page">
        <div class="manifesto-container">
            <img src="branding/Use For Website/Foglio tutte prod1.png" alt="I Fiori Oscuri" class="manifesto-image">
        </div>
    </main>

    <style>
        .manifesto-container {
            min-height: calc(100vh - 100px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-xl);
        }

        .manifesto-image {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
        }
    </style>

    <script>
        window.addEventListener('load', () => document.body.classList.remove('is-preload'));

        // Burger menu
        const burger = document.querySelector('.burger');
        const mobileMenu = document.querySelector('.mobile-menu');
        if (burger && mobileMenu) {
            burger.addEventListener('click', () => {
                burger.classList.toggle('active');
                mobileMenu.classList.toggle('active');
            });
        }
    </script>
</body>

</html>
